/* ============================================================
   LAYOUT DO PERFIL E CONFIGURAÇÕES
   ============================================================ */

/* Container Centralizado */
.profile-container {
    max-width: 900px;
    margin: 0 auto;
    animation: fadeIn 0.4s ease;
}

/* Header do Perfil (Capa e Avatar) */
.profile-header-card {
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(123, 67, 161, 0.08);
    text-align: center;
    padding-bottom: 30px;
    margin-bottom: 30px;
    border: 1px solid #F0EAF5;
}

.profile-cover {
    height: 160px;
    background: linear-gradient(135deg, #7B43A1 0%, #D8C4E9 100%);
}

.profile-avatar-wrapper {
    position: relative;
    width: 140px;
    height: 140px;
    margin: -70px auto 15px;
}

.profile-avatar-wrapper img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 6px solid white;
    object-fit: cover;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

/* Botão Flutuante de Câmera */
.btn-change-avatar {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: #7B43A1;
    color: white;
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.btn-change-avatar:hover { 
    transform: scale(1.1); 
    background: #5a2d7a; 
}

/* Informações do Header */
.profile-header-info h2 { 
    color: #4B2C71; 
    font-size: 26px; 
    margin-bottom: 8px;
}

.profile-header-info p { 
    background: #F3F0F7;
    display: inline-block;
    padding: 6px 18px;
    border-radius: 20px;
    color: #7B43A1;
    font-weight: 500;
    font-size: 13px;
}

/* Cards de Campos de Entrada (Dados e Segurança) */
.settings-card {
    background: white;
    border-radius: 24px;
    padding: 35px;
    margin-bottom: 25px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.02);
    border: 1px solid #F0EAF5;
}

.settings-card h3 {
    color: #4B2C71;
    font-size: 18px;
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.settings-card h3 i { 
    color: #7B43A1; 
    font-size: 20px;
}

/* Grid de Inputs */
.settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.input-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.input-group label {
    font-size: 12px;
    font-weight: 700;
    color: #7B43A1;
    text-transform: uppercase;
    letter-spacing: 0.8px;
}

.input-group input {
    background: #F8F6FC;
    border: 2px solid transparent;
    padding: 14px 18px;
    border-radius: 14px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    color: #4B2C71;
    transition: all 0.3s ease;
}

.input-group input:focus {
    background: white;
    border-color: #7B43A1;
    outline: none;
    box-shadow: 0 0 0 4px rgba(123, 67, 161, 0.1);
}

.security-tip {
    font-size: 12px;
    color: #aaa;
    margin-top: 15px;
    font-style: italic;
}

/* Barra de Ações Final */
.profile-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: white;
    padding: 25px 35px;
    border-radius: 24px;
    border: 1px solid #F0EAF5;
    margin-top: 10px;
    margin-bottom: 50px;
}

.btn-save-profile {
    background: #7B43A1;
    color: white;
    border: none;
    padding: 16px 50px;
    border-radius: 16px;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(123, 67, 161, 0.2);
    transition: all 0.3s ease;
}

.btn-save-profile:hover {
    background: #5a2d7a;
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(123, 67, 161, 0.3);
}

.btn-delete-account {
    background: none;
    border: none;
    color: #ff4d4d;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    opacity: 0.7;
    transition: 0.3s;
}

.btn-delete-account:hover { 
    opacity: 1; 
    text-decoration: underline; 
}

/* Responsividade */
@media (max-width: 768px) {
    .settings-grid { 
        grid-template-columns: 1fr; 
    }
    .profile-actions { 
        flex-direction: column; 
        gap: 20px; 
        text-align: center;
    }
    .btn-save-profile {
        width: 100%;
    }
}
    </style>
</head>

    <script>
        const menuItems = document.querySelectorAll('.menu-item');

        menuItems.forEach(item => {
            item.addEventListener('click', function () {

                menuItems.forEach(i => i.classList.remove('active'));

                this.classList.add('active');
            });
        });

        function toggleFilter() {
            const modal = document.getElementById('filterModal');
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
            }
        }
    </script>
