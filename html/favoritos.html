<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Lar Para Mim</title>
    <link rel="stylesheet" href="/css/inicio.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
     
.fav-filter {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

.filter-pill {
    background: white;
    border: 1px solid #E6D5F5;
    padding: 8px 20px;
    border-radius: 20px;
    color: #7B43A1;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: 0.3s;
}

.filter-pill.active, .filter-pill:hover {
    background: #7B43A1;
    color: white;
    border-color: #7B43A1;
}

/* ============================================================
   GRID DE FAVORITOS (MESMO ESTILO MEUS PETS)
   ============================================================ */

/* Reutilizando a estrutura de Grid */
.my-pets-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 25px;
    padding-top: 20px;
}

/* Ajustes no Card para Favoritos */
.pet-manage-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    transition: 0.3s;
    border: 1px solid #eee;
    display: flex;
    flex-direction: column;
}

.pet-manage-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 30px rgba(123, 67, 161, 0.15);
}

.pet-thumb {
    position: relative;
    height: 200px;
}

.pet-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Ícone de Coração sobre a foto */
.btn-heart-fav {
    position: absolute;
    top: 15px;
    right: 15px;
    background: white;
    border: none;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ff4d4d; /* Vermelho fixo pois está nos favoritos */
    cursor: pointer;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.btn-heart-fav:hover {
    transform: scale(1.15);
}

/* Detalhes internos do card */
.pet-details {
    padding: 20px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
}

.card-header-flex {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.card-header-flex h3 {
    color: #4B2C71;
    font-size: 20px;
    margin: 0;
}

.pet-age-badge {
    background: #F3F0F7;
    color: #7B43A1;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 700;
}

.pet-details p {
    color: #888;
    font-size: 13px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.pet-details p i {
    color: #7B43A1;
    width: 14px;
}

/* Botão de Contato Final */
.manage-actions {
    margin-top: auto;
    padding-top: 15px;
}

.btn-contact-fav {
    width: 100%;
    background: #7B43A1;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.btn-contact-fav:hover {
    background: #5a2d7a;
    box-shadow: 0 5px 15px rgba(123, 67, 161, 0.3);
}
    </style>
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <a href="/html/inicio.html" style="cursor: pointer;"><img src="/assets/Logo.png" width="100px"
                        alt="Logo"></a>
            </div>

            <nav>
                <a href="feed.html" class="nav-item active"><i class="fas fa-home"></i> Feed</a>
                <a href="inicio.html" class="nav-item search-bar-nav"><i class="fas fa-search"></i> Explorar Pets</a>
                <a href="novo-post.html"><button class="btn-new-post"><i class="fas fa-plus"></i> Novo post</button></a>

                <div class="menu-links">
                    <a href="cadastrar-pet.html" class="menu-item">
                        <i class="fas fa-paw"></i> Cadastrar Pet
                    </a>

                    <a href="meus-pets.html" class="menu-item flex-between">
                        <span><i class="fas fa-dog"></i> Meus Pets</span>

                    </a>

                    <a href="favoritos.html" class="menu-item">
                        <i class="fas fa-heart"></i> Favoritos
                    </a>

                    <a href="chats.html" class="menu-item">
                        <i class="fas fa-comment-dots"></i> Chats
                    </a>

                     <a href="explorar-ongs.html" class="menu-item">
                        <i class="fas fa-file-alt"></i> Ongs Parceiras
                    </a>

                    <hr>

                    <a href="perfil.html" class="menu-item flex-between">
                        <span><i class="fas fa-user-circle"></i> Perfil</span>
                        <span class="view-profile">Ver perfil</span>
                    </a>

                    <a href="configuracoes.html" class="menu-item">
                        <i class="fas fa-cog"></i> Configurações
                    </a>

                    <a href="#" class="menu-item">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </a>
                </div>
            </nav>

            <div class="user-footer">
                <i class="fas fa-user-circle"></i>
                <div>
                    <strong>Caique</strong>
                   <a href="perfil.html"> <span>Ver perfil</span> </a>
                </div>
                <a href="chats.html"><div class="chat-bubble"><i class="fas fa-comment"></i></div></a>
            </div>

        </aside>

    <main class="content">
    <div class="feed-header-wrapper">
        <h2 class="page-title">Meus Favoritos</h2>
        <p class="page-subtitle">Pets que tocaram seu coração e estão na sua lista de desejos.</p>
    </div>

    <div class="fav-filter">
        <button class="filter-pill active">Todos</button>
        <button class="filter-pill">Cachorros</button>
        <button class="filter-pill">Gatos</button>
    </div>

    <section class="my-pets-grid">
        
        <div class="pet-manage-card">
            <div class="pet-thumb">
                <img src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e" alt="Pipoca">
                <button class="btn-heart-fav active"><i class="fas fa-heart"></i></button>
            </div>
            <div class="pet-details">
                <div class="card-header-flex">
                    <h3>Pipoca</h3>
                    <span class="pet-age-badge">2 anos</span>
                </div>
                <p><i class="fas fa-paw"></i> Poodle Mix</p>
                <p><i class="fas fa-map-marker-alt"></i> Campinas, SP</p>
                
                <div class="manage-actions">
                    <button class="btn-contact-fav">Entrar em contato</button>
                </div>
            </div>
        </div>

        <div class="pet-manage-card">
            <div class="pet-thumb">
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba" alt="Mimi">
                <button class="btn-heart-fav active"><i class="fas fa-heart"></i></button>
            </div>
            <div class="pet-details">
                <div class="card-header-flex">
                    <h3>Mimi</h3>
                    <span class="pet-age-badge">5 meses</span>
                </div>
                <p><i class="fas fa-paw"></i> Gato Siamês</p>
                <p><i class="fas fa-map-marker-alt"></i> Hortolândia, SP</p>
                
                <div class="manage-actions">
                    <button class="btn-contact-fav">Entrar em contato</button>
                </div>
            </div>
        </div>

    </section>
</main>
    </div>

    <script>
        const menuItems = document.querySelectorAll('.menu-item');

        menuItems.forEach(item => {
            item.addEventListener('click', function () {

                menuItems.forEach(i => i.classList.remove('active'));

                this.classList.add('active');
            });
        });

        function toggleFilter() {
            const modal = document.getElementById('filterModal');
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
            }
        }
    </script>


</body>
